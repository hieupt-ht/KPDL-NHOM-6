# Disposable backend verification. No .env, host ports, production volumes or CF token.
x-logic: &logic
  SCHEDULER_ENABLED: "false"
  JOB_TRIGGER_TOKEN: test-only-internal-token
  WAREHOUSE_DSN: postgresql://logic_user:test-logic-only@warehouse-db:5432/test_warehouse
  MART_DSN: postgresql://logic_user:test-logic-only@mart-db:5432/test_mart

x-python-health: &python-health
  interval: 3s
  timeout: 5s
  retries: 30
  start_period: 5s

services:
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: test_warehouse
      POSTGRES_USER: test_admin
      POSTGRES_PASSWORD: test-admin-only
      INGESTION_DB_PASSWORD: test-ingestion-only
      LOGIC_DB_PASSWORD: test-logic-only
    volumes:
      - ../../../db/warehouse/init:/docker-entrypoint-initdb.d:ro
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d test_warehouse"]
      <<: *python-health

  mart-db:
    image: postgres:16
    environment:
      POSTGRES_DB: test_mart
      POSTGRES_USER: test_admin
      POSTGRES_PASSWORD: test-admin-only
      LOGIC_DB_PASSWORD: test-logic-only
      API_DB_PASSWORD: test-api-only
    volumes:
      - ../../../db/mart/init:/docker-entrypoint-initdb.d:ro
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d test_mart"]
      <<: *python-health

  analysis:
    build: {context: ../../.., dockerfile: services/analysis/Dockerfile}
    environment: *logic
    depends_on:
      warehouse-db: {condition: service_healthy}
      mart-db: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  clustering:
    build: {context: ../../.., dockerfile: services/clustering/Dockerfile}
    environment: *logic
    depends_on:
      warehouse-db: {condition: service_healthy}
      mart-db: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]

  prediction:
    build: {context: ../../.., dockerfile: services/prediction/Dockerfile}
    environment: *logic
    depends_on:
      warehouse-db: {condition: service_healthy}
      mart-db: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]

  api:
    build: {context: ../../.., dockerfile: services/api/Dockerfile}
    environment:
      <<: *logic
      MART_DSN: postgresql://api_user:test-api-only@mart-db:5432/test_mart
    depends_on:
      mart-db: {condition: service_healthy}
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]

  tests:
    build: {context: ../../.., dockerfile: services/api/tests/Dockerfile}
    environment:
      SCHEDULER_ENABLED: "false"
      TEST_MART_ADMIN_DSN: postgresql://test_admin:test-admin-only@mart-db:5432/test_mart
      TEST_MART_API_DSN: postgresql://api_user:test-api-only@mart-db:5432/test_mart
      TEST_MART_LOGIC_DSN: postgresql://logic_user:test-logic-only@mart-db:5432/test_mart
      TEST_WAREHOUSE_ADMIN_DSN: postgresql://test_admin:test-admin-only@warehouse-db:5432/test_warehouse
      TEST_API_URL: http://api:8000
      TEST_ANALYSIS_URL: http://analysis:8001
      TEST_CLUSTERING_URL: http://clustering:8002
      TEST_PREDICTION_URL: http://prediction:8003
    depends_on:
      api: {condition: service_healthy}
      analysis: {condition: service_healthy}
      clustering: {condition: service_healthy}
      prediction: {condition: service_healthy}

networks:
  default:
    internal: true
