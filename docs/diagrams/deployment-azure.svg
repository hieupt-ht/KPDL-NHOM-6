<style>
.t{font-size:30px;font-weight:700;fill:#0f172a}
.h{font-size:19px;font-weight:700;fill:#0f172a}
.s{font-size:15px;fill:#475569}
.l{font-size:14px;font-weight:600}
.box{fill:#fff;stroke:#334155;stroke-width:1.6;rx:6}
</style></defs>
<rect width="1840" height="1100" fill="#fff"/>
<text x="30" y="55" class="t">DEPLOYMENT UML TRÊN AZURE (VM + FUNCTION + CONTAINER APPS + POSTGRESQL)</text>

<!-- Azure outer -->
<rect x="350" y="100" width="1390" height="820" rx="10" fill="#f0f6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="368" y="128" class="h">«cloud» Microsoft Azure · Resource group kpdl-rg-1 · eastasia</text>

<!-- Vercel + browser -->
<rect class="box" x="30" y="150" width="230" height="100"/>
<text x="45" y="182" class="h">«node» Vercel</text>
<text x="45" y="206" class="s">Next.js frontend</text>
<text x="45" y="228" class="s">kpdl-nhom-6.vercel.app</text>
<rect class="box" x="30" y="290" width="230" height="110"/>
<text x="45" y="322" class="h">«execution env»</text>
<text x="45" y="346" class="s">Trình duyệt người dùng</text>
<text x="45" y="368" class="s">(fetch phía client)</text>
<line x1="145" y1="290" x2="145" y2="252" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
<text x="155" y="276" class="l" fill="#1d4ed8">tải UI</text>
<line x1="260" y1="345" x2="410" y2="345" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/>
<text x="268" y="334" class="l" fill="#1d4ed8">HTTPS /api/*</text>

<!-- Container Apps env -->
<rect x="380" y="150" width="720" height="390" rx="8" fill="#fff" stroke="#334155" stroke-width="1.6"/>
<text x="395" y="176" class="h">«execEnv» Azure Container Apps Environment</text>
<rect class="box" x="410" y="290" width="300" height="110"/>
<text x="425" y="320" class="h">«container» ca-api</text>
<text x="425" y="344" class="s">FastAPI · port 8000 · kpdl-api</text>
<text x="425" y="366" class="s">MART_DSN (api_user, chỉ SELECT)</text>
<text x="425" y="388" class="s">CORS_ORIGINS = domain Vercel</text>
<rect class="box" x="760" y="190" width="320" height="80"/>
<text x="775" y="218" class="h">«container» ca-analysis</text>
<text x="775" y="242" class="s">port 8001 · logic_user</text>
<rect class="box" x="760" y="300" width="320" height="80"/>
<text x="775" y="328" class="h">«container» ca-prediction</text>
<text x="775" y="352" class="s">port 8003 · image kèm model</text>
<rect class="box" x="760" y="410" width="320" height="80"/>
<text x="775" y="438" class="h">«container» ca-clustering</text>
<text x="775" y="462" class="s">port 8002 · image kèm model</text>
<!-- api -> run -->
<polyline points="710,345 735,345" fill="none" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="735" y1="230" x2="735" y2="450" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4"/>
