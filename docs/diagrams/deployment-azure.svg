<polyline points="1250,540 1250,785 1062,785" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
<text x="1100" y="772" class="l" fill="#0f766e">ghi Bronze/Silver</text>

<!-- ACR -->
<rect class="box" x="1380" y="660" width="340" height="140"/>
<text x="1395" y="690" class="h">«registry» ACR kpdlacrx7k2</text>
<text x="1395" y="714" class="s">kpdl-api:v1 · kpdl-analysis</text>
<text x="1395" y="736" class="s">kpdl-prediction:v1-models</text>
<text x="1395" y="758" class="s">kpdl-clustering:v1-models</text>
<text x="1395" y="780" class="s">Container Apps + VM kéo image</text>

