<text x="30" y="960" class="h">Chú thích</text>
<line x1="30" y1="985" x2="90" y2="985" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/><text x="100" y="990" class="s">Trình duyệt ↔ Vercel / ca-api (HTTPS)</text>
<line x1="30" y1="1015" x2="90" y2="1015" stroke="#7e22ce" stroke-width="2" marker-end="url(#p)"/><text x="100" y="1020" class="s">Gọi POST /run có Bearer token (Function, API)</text>
<line x1="30" y1="1045" x2="90" y2="1045" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/><text x="100" y="1050" class="s">Truy cập PostgreSQL theo từng user</text>
<line x1="30" y1="1075" x2="90" y2="1075" stroke="#c2410c" stroke-width="2" marker-end="url(#o)"/><text x="100" y="1080" class="s">Gọi API ngoài (Cloudflare Radar)</text>
