<line x1="735" y1="450" x2="758" y2="450" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p)"/>
<text x="410" y="212" class="l" fill="#7e22ce">- - → ca-api gọi POST /run</text><text x="410" y="232" class="l" fill="#7e22ce">(JOB_TRIGGER_TOKEN)</text>

<!-- Function -->
<rect class="box" x="1180" y="150" width="540" height="150"/>
<text x="1195" y="180" class="h">«function» Azure Function kpdl-func (Timer)</text>
<text x="1195" y="206" class="s">Analysis: mỗi 5 phút · Prediction: mỗi 5 phút</text>
<text x="1195" y="228" class="s">Clustering: hằng ngày 17:30 UTC (00:30 giờ VN)</text>
<text x="1195" y="250" class="s">App settings: ANALYSIS_URL, PREDICTION_URL,</text>
<text x="1195" y="272" class="s">CLUSTERING_URL, JOB_TRIGGER_TOKEN</text>
<polyline points="1180,225 1130,225" fill="none" stroke="#7e22ce" stroke-width="2"/>
<line x1="1130" y1="225" x2="1130" y2="450" stroke="#7e22ce" stroke-width="2"/>
<line x1="1130" y1="230" x2="1082" y2="230" stroke="#7e22ce" stroke-width="2" marker-end="url(#p)"/>
<line x1="1130" y1="340" x2="1082" y2="340" stroke="#7e22ce" stroke-width="2" marker-end="url(#p)"/>
<line x1="1130" y1="450" x2="1082" y2="450" stroke="#7e22ce" stroke-width="2" marker-end="url(#p)"/>

<!-- VM -->
<rect class="box" x="1180" y="350" width="540" height="190"/>
<text x="1195" y="380" class="h">«device» Azure VM kpdl-vm (Ubuntu + Docker)</text>
<text x="1195" y="408" class="s">«container» ingestion (restart: unless-stopped)</text>
<text x="1195" y="430" class="s">• Thu thập Cloudflare Radar mỗi 5 phút</text>
<text x="1195" y="452" class="s">• Backfill lịch sử khi khởi động</text>
<text x="1195" y="474" class="s">• Ghi Bronze + Silver (ingestion_user)</text>
<text x="1195" y="496" class="s">• Cấu hình ~/kpdl.env, vm-compose.yml</text>

<!-- PostgreSQL -->
<rect x="380" y="640" width="720" height="240" rx="8" fill="#fff" stroke="#334155" stroke-width="1.6"/>
<text x="395" y="668" class="h">«database» Azure Database for PostgreSQL Flexible Server</text>
<text x="395" y="690" class="s">kpdl-pg-x7k2 · Postgres 16</text>
<rect class="box" x="420" y="720" width="300" height="130"/>
<text x="435" y="750" class="h">Mart DB</text>
<text x="435" y="774" class="s">Gold: timeseries, trend, cluster,</text>
<text x="435" y="796" class="s">forecast, service_runs…</text>
<text x="435" y="818" class="s">api_user: SELECT · logic_user: ghi</text>
<rect class="box" x="760" y="720" width="300" height="130"/>
<text x="775" y="750" class="h">Warehouse DB</text>
<text x="775" y="774" class="s">Bronze (JSON thô) · Silver</text>
<text x="775" y="796" class="s">metrics_hourly</text>
<text x="775" y="818" class="s">ingestion_user: ghi · logic_user: đọc</text>

